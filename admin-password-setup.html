<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#176b46">
  <title>Admin Password Setup — EcoGrocer BD</title>
  <style>
    :root{color-scheme:light;--green:#176b46;--dark:#104b32;--ink:#183329;--muted:#6d7d74;--line:#dce8e0}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f3f8f4;color:var(--ink);font-family:system-ui,"Noto Sans Bengali",sans-serif}
    main{width:min(100%,460px);padding:30px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px #18332918}
    h1{margin:0 0 8px;color:var(--dark);font-size:25px}p{color:var(--muted);font-size:14px;line-height:1.75}
    label{display:block;margin:18px 0 7px;font-size:13px;font-weight:700}
    input{width:100%;height:48px;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}
    button{width:100%;height:49px;margin-top:22px;border:0;border-radius:10px;background:var(--green);color:white;font:700 14px system-ui;cursor:pointer}
    button:disabled{opacity:.65;cursor:wait}.status{display:none;margin-top:16px;padding:12px;border-radius:9px;background:#eff5f0;font-size:13px;line-height:1.6}.status.show{display:block}.status.error{background:#fff0ef;color:#a3322b}.status.success{background:#eaf6ed;color:#176b46}
    .hint{margin-top:18px;font-size:12px}
  </style>
</head>
<body>
<main>
  <h1>প্রথম অ্যাডমিন পাসওয়ার্ড সেট করুন</h1>
  <p>এই একবারের নিরাপদ সেটআপে পাসওয়ার্ড সরাসরি Supabase Auth-এ সংরক্ষিত হবে। কোনো ইমেইল পাঠানো হবে না। সেটআপ সম্পন্ন হলে এই লিংক আর কাজ করবে না।</p>
  <form id="setup-form">
    <label for="setup-code">একবারের সেটআপ কোড</label>
    <input id="setup-code" type="password" autocomplete="off" required>
    <label for="password">নতুন পাসওয়ার্ড (কমপক্ষে ১২ অক্ষর)</label>
    <input id="password" type="password" autocomplete="new-password" minlength="12" required>
    <label for="confirm-password">পাসওয়ার্ড নিশ্চিত করুন</label>
    <input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required>
    <button id="submit-button" type="submit">পাসওয়ার্ড সংরক্ষণ করুন</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </form>
  <p class="hint">শুধু অনুমোদিত EcoGrocer BD অ্যাডমিনের জন্য। সেটআপ কোড ও পাসওয়ার্ড কাউকে দেবেন না।</p>
</main>
<script type="module">
  const SUPABASE_URL = "https://ucwaoytakqldicdtoran.supabase.co";
  const PUBLISHABLE_KEY = "sb_publishable_wpp9kVHNg5pZeGRY0Eoxaw_iyyQez9Q";
  const form = document.getElementById("setup-form");
  const button = document.getElementById("submit-button");
  const statusBox = document.getElementById("status");

  function showStatus(message, kind = "") {
    statusBox.textContent = message;
    statusBox.className = "status show" + (kind ? " " + kind : "");
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const setupCode = document.getElementById("setup-code").value.trim();
    const password = document.getElementById("password").value;
    const confirmation = document.getElementById("confirm-password").value;

    if (password.length < 12) return showStatus("কমপক্ষে ১২ অক্ষরের পাসওয়ার্ড দিন।", "error");
    if (password !== confirmation) return showStatus("দুটি পাসওয়ার্ড মেলেনি। আবার মিলিয়ে লিখুন।", "error");

    button.disabled = true;
    button.textContent = "নিরাপদে সংরক্ষণ হচ্ছে…";
    statusBox.className = "status";
    try {
      const response = await fetch(SUPABASE_URL + "/functions/v1/admin-password-setup", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": PUBLISHABLE_KEY,
          "Authorization": "Bearer " + PUBLISHABLE_KEY
        },
        body: JSON.stringify({ setupCode, password, confirmPassword: confirmation })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || "পাসওয়ার্ড সংরক্ষণ করা যায়নি।");
      form.reset();
      showStatus("পাসওয়ার্ড সফলভাবে Supabase-এ সংরক্ষিত হয়েছে। এখন Admin Login পেজে গিয়ে Gmail ও এই নতুন পাসওয়ার্ড দিয়ে লগইন করুন।", "success");
    } catch (error) {
      showStatus(error.message || "অনুরোধটি সম্পন্ন হয়নি।", "error");
    } finally {
      button.disabled = false;
      button.textContent = "পাসওয়ার্ড সংরক্ষণ করুন";
    }
  });
</script>
</body>
</html>
